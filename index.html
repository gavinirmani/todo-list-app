<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>My Tasks</h1>
            <p class="task-count">
                <span id="remaining-count">0</span> remaining task<span id="plural">s</span>
            </p>
        </header>

        <!-- Input Section -->
        <div class="input-section">
            <input 
                type="text" 
                id="task-input" 
                class="task-input" 
                placeholder="Add a new task..."
                aria-label="Add a new task"
            >
            <button id="add-btn" class="add-btn" aria-label="Add task">
                <span>+</span>
            </button>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <!-- Tasks List -->
        <div class="tasks-container">
            <ul id="tasks-list" class="tasks-list">
                <!-- Tasks will be added here by JavaScript -->
            </ul>
            <div id="empty-state" class="empty-state">
                <p>No tasks yet. Add one to get started! 🚀</p>
            </div>
        </div>

        <!-- Clear Completed Button -->
        <div class="action-section">
            <button id="clear-completed-btn" class="clear-btn">Clear Completed</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
